<title>{{TITLE}}</title>
<style>{{FONTS}}</style>
<style>
/* Betting carousel slide: 540x675 CSS px rendered at 2x -> 1080x1350.
   Dark court-night background, paper "tickets" for picks and slips, neon for the
   numbers that matter (odds, edge, profit). */
:root {
  --bg: #0b1210;
  --bg2: #10201a;
  --paper: #f4f2ea;
  --paper-ink: #13201a;
  --paper-muted: #5f6b64;
  --pop: #c8ff3d;
  --edge: #0b8a4f;
  --arb: #f5b83d;
  --ink: #ffffff;
  --muted: rgba(255, 255, 255, .62);
  --faint: rgba(255, 255, 255, .12);
  --font: "Figtree", "Segoe UI", system-ui, sans-serif;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --mono: "Cascadia Mono", "Consolas", ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { width: 540px; height: 675px; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--font); font-variant-numeric: tabular-nums; }
.slide { position: relative; width: 540px; height: 675px; padding: 18px 22px 12px; display: flex; flex-direction: column;
  background: radial-gradient(ellipse 90% 55% at 50% -5%, color-mix(in srgb, var(--accent, var(--pop)) 18%, transparent), transparent 70%),
              linear-gradient(180deg, var(--bg2), var(--bg)); }
.slide.arb { --accent: var(--arb); }
.top { display: flex; justify-content: space-between; align-items: center; }
.kick { font-size: 9.5px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; background: var(--accent, var(--pop)); color: #111; padding: 4px 8px; border-radius: 3px; }
.date { font-size: 9.5px; font-weight: 700; color: var(--muted); }
.foot { margin-top: auto; padding-top: 8px; display: flex; justify-content: space-between; font-size: 7.5px; font-weight: 600; color: rgba(255, 255, 255, .45); }
.foot b { color: rgba(255, 255, 255, .7); }

/* ---- cover ---- */
h1 { margin: 14px 0 0; font-family: var(--display); font-weight: 800; font-size: 62px; line-height: .86; text-transform: uppercase; }
h1 span { color: var(--accent, var(--pop)); }
.lede { margin-top: 10px; font-size: 13px; font-weight: 600; color: var(--muted); max-width: 440px; line-height: 1.4; }
.games { margin-top: 10px; display: grid; gap: 3px; }
.games div { display: flex; gap: 10px; align-items: baseline; font-family: var(--display); font-weight: 700; font-size: 17px; text-transform: uppercase; }
.games b { font-family: var(--mono); font-size: 13px; color: var(--accent, var(--pop)); font-weight: 600; }
.list { margin-top: 12px; display: grid; gap: 4px; }
.li { display: grid; grid-template-columns: 26px 1fr auto 52px; gap: 8px; align-items: center; padding: 4px 10px; border-radius: 6px; background: rgba(255, 255, 255, .05); }
.li .n { font-family: var(--display); font-weight: 800; font-size: 18px; color: var(--accent, var(--pop)); }
.li .p { min-width: 0; font-family: var(--display); font-weight: 700; font-size: 17px; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.li .p small { font-family: var(--font); font-weight: 600; font-size: 10px; text-transform: none; color: var(--muted); margin-left: 6px; }
.li .o { font-family: var(--mono); font-size: 14px; font-weight: 600; }
.li .e { text-align: right; font-family: var(--display); font-weight: 800; font-size: 16px; color: var(--accent, var(--pop)); }
.books { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 5px; }
.books span { font-size: 9px; font-weight: 700; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--faint); color: var(--muted); }
.books span.off { text-decoration: line-through; opacity: .6; }

/* ---- pick tickets ---- */
.head { margin-top: 12px; font-family: var(--display); font-weight: 800; font-size: 34px; text-transform: uppercase; line-height: 1; }
.head small { display: block; font-family: var(--font); font-size: 11px; font-weight: 600; text-transform: none; color: var(--muted); margin-top: 4px; }
.tickets { margin-top: 16px; display: grid; gap: 14px; }
.ticket { position: relative; display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: center; padding: 15px 16px; border-radius: 10px; background: var(--paper); color: var(--paper-ink); }
.ticket::before, .ticket::after { content: ""; position: absolute; top: 50%; width: 14px; height: 14px; margin-top: -7px; border-radius: 50%; background: var(--bg); }
.ticket::before { left: -7px; } .ticket::after { right: -7px; }
.ticket .n { font-family: var(--display); font-weight: 800; font-size: 38px; text-align: center; color: var(--edge); }
.ticket .who { min-width: 0; display: grid; gap: 1px; }
.ticket .pl { font-family: var(--display); font-weight: 800; font-size: 26px; line-height: 1; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ticket .bet { font-size: 15px; font-weight: 700; }
.ticket .bet i { font-style: normal; font-size: 9px; font-weight: 800; color: #a8461d; border: 1px solid currentColor; border-radius: 3px; padding: 0 3px; margin-left: 4px; }
.ticket .meta { font-size: 10px; font-weight: 600; color: var(--paper-muted); }
.ticket .px { text-align: right; display: grid; gap: 2px; justify-items: end; }
.ticket .px b { font-family: var(--mono); font-size: 30px; font-weight: 700; line-height: 1; }
.ticket .px span { font-size: 10px; font-weight: 700; color: var(--paper-muted); }
.ticket .px em { font-style: normal; font-size: 12px; font-weight: 800; color: #fff; background: var(--edge); border-radius: 3px; padding: 1px 5px; }

/* ---- slip ---- */
.slip { margin-top: 12px; background: var(--paper); color: var(--paper-ink); border-radius: 10px; padding: 12px 14px 10px; display: grid; gap: 0;
  -webkit-mask: radial-gradient(circle 6px at 50% 100%, transparent 98%, #000) 0 0 / 16px 100% repeat-x; }
.slip .sh { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1.5px dashed #c9c5b6; padding-bottom: 6px; }
.slip .sh b { font-family: var(--display); font-weight: 800; font-size: 18px; text-transform: uppercase; }
.slip .sh span { font-size: 10px; font-weight: 700; color: var(--paper-muted); }
.sl { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: var(--lp, 12px) 0; border-bottom: 1px solid #e2ded2; }
.sl .pl { font-family: var(--display); font-weight: 800; font-size: var(--lf, 22px); text-transform: uppercase; line-height: 1; }
.sl .bt { font-size: var(--bf, 13px); font-weight: 600; color: var(--paper-muted); }
.sl .bt i, .ticket .bet i { font-style: normal; font-size: 9px; font-weight: 800; color: #a8461d; border: 1px solid currentColor; border-radius: 3px; padding: 0 3px; margin-left: 5px; }
.sl .o { font-family: var(--mono); font-size: var(--of, 21px); font-weight: 700; }
.tot { display: flex; justify-content: space-between; align-items: flex-end; padding-top: 8px; }
.tot .k { font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--paper-muted); }
.tot .v { font-family: var(--display); font-weight: 800; font-size: 44px; line-height: .9; color: var(--edge); }
.facts { margin-top: 10px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.facts div { background: rgba(255, 255, 255, .06); border-radius: 6px; padding: 6px 8px; display: grid; }
.facts span { font-size: 8.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.facts b { font-family: var(--display); font-weight: 800; font-size: 22px; color: var(--accent, var(--pop)); }
.note { margin-top: 8px; font-size: 9.5px; font-weight: 600; color: var(--muted); line-height: 1.4; }

/* ---- arbitrage ---- */
.arbcard { margin-top: 18px; display: grid; gap: 16px; }
.arbcard .pl { font-family: var(--display); font-weight: 800; font-size: 58px; line-height: .9; text-transform: uppercase; }
.arbcard .mk { font-size: 17px; font-weight: 700; color: var(--muted); }
.profit { display: flex; align-items: baseline; gap: 10px; }
.profit b { font-family: var(--display); font-weight: 800; font-size: 130px; line-height: .85; color: var(--arb); }
.profit span { font-size: 13px; font-weight: 700; color: var(--muted); max-width: 170px; line-height: 1.3; }
.legs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.legx { background: var(--paper); color: var(--paper-ink); border-radius: 10px; padding: 16px 16px; display: grid; gap: 4px; }
.legx span { font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--paper-muted); }
.legx b { font-family: var(--mono); font-size: 44px; font-weight: 700; line-height: 1.05; }
.legx .bk { font-family: var(--display); font-weight: 800; font-size: 24px; text-transform: uppercase; }
.legx .st { font-size: 15px; font-weight: 700; }
.legx i { font-style: normal; font-size: 9px; font-weight: 800; color: #a8461d; }
.ret { font-size: 14px; font-weight: 600; color: var(--muted); line-height: 1.4; }
.ret b { color: var(--ink); }
</style>

{{BODY}}
