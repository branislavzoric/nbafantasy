<title>{{TEAM_NAME}} Depth Chart</title>
<style>{{FONTS}}</style>
<style>
/* Team depth chart on a court: 540x675 CSS px rendered at 2x -> 1080x1350.
   Court is drawn to scale (50 x 94 ft) at 6.38 px/ft; player tokens are placed
   in court feet by the builder. Team colours come in as --team / --accent. */
:root {
  --team: #0E2240;
  --accent: #FEC524;
  --on-accent: #0E2240;
  --ink: #ffffff;
  --muted: rgba(255, 255, 255, .66);
  --faint: rgba(255, 255, 255, .14);
  --font: "Figtree", "Segoe UI", system-ui, sans-serif;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --line: rgba(25, 20, 15, .82);
  {{TEAM_VARS}}
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: #121212; color: var(--ink); font-family: var(--font); width: 540px; height: 675px; overflow: hidden; }
.page { width: 540px; height: 675px; position: relative; background: var(--team); font-variant-numeric: tabular-nums; }

header { position: absolute; left: 14px; right: 12px; top: 10px; height: 22px; display: flex; align-items: center; justify-content: space-between; }
header .note { font-size: 9px; font-weight: 700; color: var(--muted); }
.tags { display: flex; gap: 6px; font-size: 9px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
.tag-main { background: var(--accent); color: var(--on-accent); padding: 3px 7px; border-radius: 3px; }
.draft { border: 1px dashed var(--muted); color: var(--muted); padding: 2px 6px; border-radius: 3px; }

/* ---- court ---- */
/* Dark apron around the floor with the team name on both baselines, like an arena court. */
.apron { position: absolute; left: 14px; top: 44px; width: 320px; height: 616px; background: #141414; border-radius: 3px; }
.baseline-name { position: absolute; left: 0; right: 0; height: 30px; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 21px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent-text); line-height: 1; }
.baseline-name.top { top: 0; }
.baseline-name.bottom { bottom: 0; transform: rotate(180deg); }
.court { position: absolute; left: 12px; top: 30px; width: 296px; height: 556px; overflow: hidden;
  background:
    repeating-linear-gradient(0deg, rgba(140, 95, 40, .045) 0 2px, transparent 2px 9px),
    repeating-linear-gradient(90deg, #ead5ab 0 7px, #e3cb9d 7px 14px, #eed9b0 14px 21px, #e0c798 21px 28px); }
.court svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.court .lines { fill: none; stroke: var(--line); stroke-width: .17; }
.court .paint { fill: var(--team); }
.court .paint-line { fill: none; stroke: rgba(255, 255, 255, .55); stroke-width: .17; }
.court .center { fill: #f4f0e6; stroke: var(--accent); stroke-width: .45; }
.unit-label { position: absolute; left: 6px; font-size: 8px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; background: var(--team); color: var(--accent-text); padding: 2px 6px; border-radius: 2px; }

.token { position: absolute; width: 124px; height: 46px; display: flex; align-items: center; gap: 4px; padding: 4px 7px 4px 4px;
  background: color-mix(in srgb, var(--team) 94%, transparent); border-radius: 6px; border: 1.5px solid var(--faint);
  box-shadow: 0 3px 8px rgba(0, 0, 0, .35); }
.token.starter { border-color: var(--accent); }
.face { flex: none; width: 30px; height: 30px; border-radius: 50%; overflow: hidden; background: var(--accent); position: relative; }
.face img { position: absolute; left: 50%; top: 2px; height: 36px; transform: translateX(-50%); }
.face .initials { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 14px; color: var(--on-accent); }
.info { min-width: 0; flex: 1; display: grid; gap: 1px; }
.pos { display: flex; align-items: center; gap: 3px; font-size: 7.5px; font-weight: 800; letter-spacing: .06em; color: var(--accent-text); }
.pos .inj { background: #c8263c; color: #fff; padding: 0 3px; border-radius: 2px; letter-spacing: .02em; }
.name { font-family: var(--display); font-weight: 800; text-transform: uppercase; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; }
.name.long { font-size: 11px; } .name.xlong { font-size: 9.5px; }
.stats { display: flex; gap: 6px; font-size: 6.5px; font-weight: 800; letter-spacing: .05em; color: var(--muted); white-space: nowrap; }
.stats b { font-size: 9.5px; letter-spacing: 0; margin-right: 1px; }
.stats b { color: var(--ink); font-weight: 800; }
.stats b.fp { color: var(--accent-text); }

/* ---- bench ---- */
.bench { position: absolute; left: 344px; top: 44px; width: 184px; height: 616px; display: flex; flex-direction: column; gap: 6px; }
.panel-title { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--faint); padding-bottom: 3px; }
.panel-title b { font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--accent-text); }
.panel-title span { font-size: 8.5px; color: var(--muted); font-weight: 600; }
.bench-row { display: flex; align-items: center; gap: 6px; background: rgba(255, 255, 255, .06); border: 1px solid var(--faint); border-radius: 6px; padding: 5px 7px 5px 5px; height: 54px; }
.bench-row .face { width: 38px; height: 38px; }
.bench-row .face img { height: 44px; }
.bench-row .name { font-size: 14px; }
.bench-row .name.long { font-size: 12px; } .bench-row .name.xlong { font-size: 11px; }
.bench-row .first { font-size: 8px; color: var(--muted); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bench-row .stats { font-size: 7px; } .bench-row .stats b { font-size: 10.5px; }

.wins { margin-top: auto; border: 1.5px solid var(--accent); border-radius: 6px; padding: 10px 12px 11px; background: rgba(255, 255, 255, .06); display: grid; justify-items: start; }
.wins .label { font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--accent-text); }
.wins b { font-family: var(--display); font-weight: 800; font-size: 66px; line-height: .9; margin-top: 4px; }
.wins .rec { font-size: 10px; font-weight: 700; color: var(--muted); margin-top: 2px; }
.wins .src { font-size: 7.5px; color: var(--muted); margin-top: 6px; line-height: 1.35; }
</style>

<div class="page">
  <header>
    <div class="tags"><span class="tag-main">2026-27 Depth Chart</span><span class="draft">Draft</span></div>
    <span class="note">Projected rotation</span>
  </header>

  <div class="apron">
  <div class="baseline-name top">{{TEAM_NAME}}</div>
  <div class="baseline-name bottom">{{TEAM_NAME}}</div>
  <div class="court">
    <svg viewBox="0 0 50 94" preserveAspectRatio="none" aria-hidden="true">
      <g>
        <rect class="paint" x="17" y="0" width="16" height="19"/>
        <path class="paint-line" d="M17 0 V19 H33 V0"/>
        <path class="lines" d="M19 19 A6 6 0 0 0 31 19"/>
        <path class="paint-line" d="M19 19 A6 6 0 0 1 31 19" stroke-dasharray=".9 .7"/>
        <path class="lines" d="M3 0 V14 A23.75 23.75 0 0 0 47 14 V0"/>
        <line class="paint-line" x1="22" y1="4" x2="28" y2="4"/>
        <circle class="paint-line" cx="25" cy="5.25" r=".75"/>
        <path class="paint-line" d="M21 5.25 A4 4 0 0 0 29 5.25"/>
      </g>
      <g transform="translate(0 94) scale(1 -1)">
        <rect class="paint" x="17" y="0" width="16" height="19"/>
        <path class="paint-line" d="M17 0 V19 H33 V0"/>
        <path class="lines" d="M19 19 A6 6 0 0 0 31 19"/>
        <path class="paint-line" d="M19 19 A6 6 0 0 1 31 19" stroke-dasharray=".9 .7"/>
        <path class="lines" d="M3 0 V14 A23.75 23.75 0 0 0 47 14 V0"/>
        <line class="paint-line" x1="22" y1="4" x2="28" y2="4"/>
        <circle class="paint-line" cx="25" cy="5.25" r=".75"/>
        <path class="paint-line" d="M21 5.25 A4 4 0 0 0 29 5.25"/>
      </g>
      <rect class="lines" x=".08" y=".08" width="49.84" height="93.84"/>
      <line class="lines" x1="0" y1="47" x2="50" y2="47"/>
      <circle class="center" cx="25" cy="47" r="6"/>
      {{LOGO}}
    </svg>
    {{COURT_TOKENS}}
  </div>
  </div>

  <div class="bench">
    <div class="panel-title"><b>Reserves</b><span>bench</span></div>
    {{BENCH}}
    {{WINS}}
  </div>
</div>
