<title>Highlight Reel Slide</title>
<style>{{FONTS}}</style>
<style>
/* One full slide of the player game-highlight reel: 540x960 CSS px rendered at 2x -> 1080x1920.
   Slides: .intro, .stats (count-up), .moments (timeline, one step per slide), .outro */
:root {
  --team: #0E2240;
  --accent: #FEC524;
  --on-accent: #0E2240;
  --ink: #ffffff;
  --muted: rgba(255, 255, 255, .7);
  --faint: rgba(255, 255, 255, .16);
  --strip: rgba(255, 255, 255, .07);
  --b3: #1f2420;
  --pink: #ff6fa5;
  --font: "Figtree", "Segoe UI", system-ui, sans-serif;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  {{TEAM_VARS}}
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--team); color: var(--ink); font-family: var(--font); width: 540px; height: 960px; overflow: hidden; font-variant-numeric: tabular-nums; }
.slide { position: relative; width: 540px; height: 960px; overflow: hidden; }
.kicker { font-size: 13px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--accent-text); }
.brand { position: absolute; left: 24px; right: 24px; bottom: 22px; display: flex; justify-content: space-between; align-items: center; font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .04em; }
.brand img { height: 30px; border-radius: 4px; }

/* intro */
.intro .photo { position: absolute; left: 0; right: 0; top: 0; height: 640px; background-size: cover; background-position: 50% 18%; }
.intro .shade { position: absolute; left: 0; right: 0; top: 300px; height: 342px; background: linear-gradient(to bottom, transparent, var(--team)); }
.intro .credit { position: absolute; right: 10px; top: 10px; font-size: 8.5px; font-weight: 600; color: #fff; background: rgba(0, 0, 0, .45); padding: 3px 6px; border-radius: 3px; }
.intro .text { position: absolute; left: 24px; right: 24px; top: 520px; }
.intro .first { font-size: 24px; font-weight: 700; color: var(--muted); }
.intro .last { font-family: var(--display); font-weight: 800; font-size: 120px; line-height: .86; text-transform: uppercase; margin-top: 2px; }
.intro .last.long { font-size: 92px; } .intro .last.xlong { font-size: 72px; }
.intro .badge { display: inline-block; margin-top: 16px; background: var(--accent); color: var(--on-accent); font-family: var(--display); font-weight: 800; font-size: 30px; letter-spacing: .05em; text-transform: uppercase; padding: 5px 14px 3px; border-radius: 4px; }
.score { position: absolute; left: 24px; right: 24px; top: 800px; display: grid; grid-template-columns: 52px 1fr auto 1fr 52px; align-items: center; gap: 10px; background: var(--strip); border: 1px solid var(--faint); border-radius: 8px; padding: 10px 14px; }
.score img { width: 52px; height: 52px; object-fit: contain; }
.score .t { display: grid; font-family: var(--display); font-weight: 700; font-size: 22px; line-height: 1; }
.score .t b { font-size: 46px; font-weight: 800; }
.score .t.lose b { color: var(--muted); }
.score .t.away { text-align: right; }
.score .mid { font-size: 10px; font-weight: 800; letter-spacing: .12em; color: var(--muted); text-align: center; text-transform: uppercase; }

/* stats */
.hdr { position: absolute; left: 24px; right: 24px; top: 40px; }
.hdr h2 { margin: 6px 0 0; font-family: var(--display); font-weight: 800; font-size: 46px; line-height: .95; text-transform: uppercase; }
.hdr .sub { font-size: 14px; font-weight: 700; color: var(--muted); margin-top: 6px; }
.bigrows { position: absolute; left: 24px; right: 24px; top: 168px; display: grid; gap: 4px; }
.bigrows div { display: flex; align-items: baseline; gap: 16px; border-left: 6px solid var(--accent); padding-left: 16px; }
.bigrows b { font-family: var(--display); font-weight: 800; font-size: 150px; line-height: .98; min-width: 170px; }
.bigrows span { font-family: var(--display); font-weight: 700; font-size: 40px; letter-spacing: .06em; color: var(--muted); text-transform: uppercase; }
.bigrows div.hit b { color: var(--accent-text); }
.strip { position: absolute; left: 24px; right: 24px; top: 724px; display: grid; grid-template-columns: repeat(3, 1fr); background: var(--strip); border: 1px solid var(--faint); border-radius: 8px; }
.strip div { display: grid; justify-items: center; padding: 14px 0 12px; }
.strip div:nth-child(3n+2), .strip div:nth-child(3n+3) { border-left: 1px solid var(--faint); }
.strip div:nth-child(n+4) { border-top: 1px solid var(--faint); }
.strip b { font-family: var(--display); font-size: 40px; font-weight: 700; line-height: 1; }
.strip span { font-size: 10px; font-weight: 800; letter-spacing: .12em; color: var(--muted); margin-top: 5px; }

/* moments */
.tl { position: absolute; left: 24px; right: 24px; top: 168px; margin: 0; padding: 0; list-style: none; }
.tl::before { content: ""; position: absolute; left: 9px; top: 12px; bottom: 30px; width: 2px; background: var(--faint); }
.tl li { position: relative; padding: 0 0 22px 40px; }
.tl li::before { content: ""; position: absolute; left: 1px; top: 6px; width: 14px; height: 14px; border-radius: 50%; background: var(--team); border: 3px solid var(--muted); }
.tl li.next { visibility: hidden; }
.tl li.past { opacity: .5; }
.tl li.on::before { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 6px rgba(255, 255, 255, .12); }
.tl .when { font-size: 12px; font-weight: 800; letter-spacing: .12em; color: var(--accent-text); text-transform: uppercase; }
.tl li.past .when { color: var(--muted); }
.tl .what b { display: block; font-family: var(--display); font-weight: 800; font-size: 36px; line-height: 1; text-transform: uppercase; margin-top: 3px; }
.tl li.on .what b { font-size: 44px; }
.tl .what span { display: block; font-size: 15px; font-weight: 600; color: var(--muted); margin-top: 4px; }
.tl li.on .what span { color: var(--ink); font-size: 17px; }
.tracker { position: absolute; left: 24px; right: 24px; top: 790px; display: grid; grid-template-columns: auto repeat(3, 1fr); align-items: center; background: var(--strip); border: 1px solid var(--faint); border-radius: 8px; padding: 10px 16px; }
.tracker .lbl { font-size: 10px; font-weight: 800; letter-spacing: .12em; color: var(--muted); text-transform: uppercase; line-height: 1.3; padding-right: 14px; }
.tracker div { display: flex; align-items: baseline; justify-content: center; gap: 6px; }
.tracker b { font-family: var(--display); font-weight: 800; font-size: 44px; line-height: 1; }
.tracker span { font-size: 11px; font-weight: 800; letter-spacing: .1em; color: var(--muted); }
.tracker div.hit b { color: var(--accent-text); }

/* outro */
.outro .face { position: absolute; left: 50%; top: 80px; width: 260px; height: 260px; margin-left: -130px; border-radius: 50%; border: 6px solid var(--accent); background-size: cover; background-position: 50% 18%; }
.outro .line { position: absolute; left: 24px; right: 24px; top: 372px; text-align: center; font-family: var(--display); font-weight: 800; font-size: 104px; line-height: 1; }
.outro .line i { font-style: normal; color: var(--accent-text); }
.outro .labels { position: absolute; left: 24px; right: 24px; top: 480px; text-align: center; font-size: 13px; font-weight: 800; letter-spacing: .2em; color: var(--muted); }
.outro .res { position: absolute; left: 24px; right: 24px; top: 530px; text-align: center; font-size: 22px; font-weight: 700; }
.outro .cta { position: absolute; left: 40px; right: 40px; top: 620px; background: var(--b3); border-radius: 10px; padding: 18px 18px 16px; text-align: center; border: 2px solid var(--pink); }
.outro .cta img { width: 300px; display: block; margin: 0 auto 10px; }
.outro .cta div { font-size: 17px; font-weight: 700; }
.outro .cta div b { color: var(--pink); }
.outro .credits { position: absolute; left: 24px; right: 24px; top: 838px; text-align: center; font-size: 10px; font-weight: 600; color: var(--muted); line-height: 1.5; }
</style>

{{BODY}}
