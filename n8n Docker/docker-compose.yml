services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=Europe/Belgrade
      - TZ=Europe/Belgrade
      - N8N_RESTRICT_FILE_ACCESS_TO=/files   # lets n8n read/write the content folders
      - NODES_EXCLUDE=[]                     # enables the Execute Command node (used to move files)
    volumes:
      - n8n_data:/home/node/.n8n
      - C:/Users/Zoric/nbafantasy/content:/files/content
    restart: unless-stopped
volumes:
  n8n_data:
