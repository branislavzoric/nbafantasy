<title>{{TITLE}}</title>
<style>{{FONTS}}</style>
<style>
/* News post: 540x675 CSS px rendered at 2x -> 1080x1350. Top: story photo (or team
   colours) with the players in front; bottom: label line, big highlighted numbers,
   one line of context. Team colours come in as --c1 / --c2. */
:root {
  --c1: #1d428a;
  --c2: #c8102e;
  --pop: #eef33a;
  --ink: #ffffff;
  --muted: rgba(255, 255, 255, .72);
  --font: "Figtree", "Segoe UI", system-ui, sans-serif;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  {{VARS}}
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { width: 540px; height: 675px; overflow: hidden; background: #07090f; color: var(--ink); font-family: var(--font); }
.post { position: relative; width: 540px; height: 675px; overflow: hidden; background: #07090f; }

/* ---- hero ---- */
.hero { position: absolute; left: 0; right: 0; top: 0; height: 432px; overflow: hidden;
  background: radial-gradient(ellipse 90% 80% at 50% 30%, color-mix(in srgb, var(--c2) 70%, var(--c1)), var(--c1) 70%); }
.hero .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: saturate(.85) brightness(var(--bgb, .62)); }
.hero .tint { position: absolute; inset: 0; background: linear-gradient(180deg, color-mix(in srgb, var(--c1) 35%, transparent) 0%, transparent 35%, color-mix(in srgb, var(--c1) 30%, transparent) 70%, #07090f 100%); }
.split { position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; background: rgba(255, 255, 255, .55); }
.split-bg { position: absolute; top: 0; bottom: 0; width: 50%; }
.figs { position: absolute; left: 0; right: 0; bottom: 0; -webkit-mask-image: linear-gradient(180deg, #000 82%, transparent 100%); mask-image: linear-gradient(180deg, #000 82%, transparent 100%); display: flex; justify-content: center; align-items: flex-end; gap: 0; }
.fig { position: relative; display: grid; justify-items: center; }
.fig.full img { display: block; width: 470px; filter: drop-shadow(0 10px 24px rgba(0, 0, 0, .55)); }
.figs.n2 .fig.full img { width: 290px; }
.fig.face { margin-bottom: 70px; }
.ring { width: var(--d, 250px); height: var(--d, 250px); border-radius: 50%; overflow: hidden; position: relative;
  background: radial-gradient(circle at 50% 35%, color-mix(in srgb, var(--rc, var(--c2)) 80%, #fff), var(--rc, var(--c2)) 70%);
  box-shadow: 0 0 0 6px var(--rc, var(--c2)), 0 0 0 9px rgba(255, 255, 255, .85), 0 14px 34px rgba(0, 0, 0, .55); }
.ring img { position: absolute; width: 205%; left: -52.5%; top: -2%; }
.fig .tag { margin-top: 14px; font-family: var(--display); font-weight: 800; font-size: 19px; letter-spacing: .03em; text-transform: uppercase; text-shadow: 0 2px 8px rgba(0, 0, 0, .6); }
.fig .tag b { display: block; text-align: center; color: var(--pop); font-size: 24px; line-height: 1; }
.figs.n3 { gap: 18px; }
.figs.n3 .ring { --d: 148px; }
.figs.n2 .ring { --d: 196px; }
.figs.n2 { gap: 46px; }
.logo { position: absolute; left: 50%; top: 48%; transform: translate(-50%, -50%); width: 230px; filter: drop-shadow(0 10px 30px rgba(0, 0, 0, .6)); }

.top { position: absolute; left: 18px; right: 18px; top: 16px; display: flex; justify-content: space-between; align-items: center; z-index: 3; }
.kick { font-size: 9.5px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; background: var(--pop); color: #111; padding: 4px 8px; border-radius: 3px; }
.date { font-size: 9.5px; font-weight: 700; color: var(--muted); text-shadow: 0 1px 4px rgba(0, 0, 0, .6); }

/* ---- text ---- */
.text { position: absolute; left: 0; right: 0; bottom: 0; top: 440px; padding: 0 24px 16px; display: flex; flex-direction: column; align-items: center; text-align: center;
  background: linear-gradient(180deg, transparent, color-mix(in srgb, var(--c1) 35%, #07090f) 100%); }
.label { font-family: var(--display); font-weight: 600; font-size: 21px; letter-spacing: .01em; text-transform: uppercase; line-height: 1.05; text-wrap: balance; }
.stats { margin-top: 6px; display: flex; justify-content: center; gap: 30px; width: 100%; }
.stat { display: grid; justify-items: center; min-width: 0; flex: 1; max-width: 250px; }
.stat b { font-family: var(--display); font-weight: 800; font-size: 72px; line-height: .92; color: var(--pop); letter-spacing: -.01em; white-space: nowrap; }
.stats.one .stat { max-width: none; }
.stats.one .stat b { font-size: 80px; }
.stat b.quote { font-size: 54px; white-space: normal; line-height: .95; }
.stats.one .stat b.quote.long { font-size: 58px; white-space: nowrap; }
.stat span { margin-top: 5px; font-family: var(--display); font-weight: 800; font-size: 18px; line-height: 1.05; text-transform: uppercase; text-wrap: balance; }
.text.nostats .label { font-size: 26px; margin-top: 8px; }
.text.nostats .ctx { margin-top: 18px; font-size: 15px; color: var(--ink); }
.ctx { margin-top: auto; font-size: 11.5px; font-weight: 600; color: var(--muted); line-height: 1.4; max-width: 470px; text-wrap: balance; }
.src { margin-top: 6px; font-size: 7.5px; font-weight: 600; color: rgba(255, 255, 255, .45); letter-spacing: .03em; }
</style>

<div class="post">
  <div class="hero">
    {{BG}}
    <div class="tint"></div>
    {{FIGS}}
  </div>
  <div class="top"><span class="kick">{{KICKER}}</span><span class="date">{{DATE}}</span></div>
  <div class="text{{TEXT_CLASS}}">
    <div class="label">{{LABEL}}</div>
    {{STATS}}
    <div class="ctx">{{CONTEXT}}</div>
    <div class="src">{{SOURCE}}</div>
  </div>
</div>
