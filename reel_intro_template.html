<title>Top 10 Intro</title>
<style>{{FONTS}}</style>
<style>
/* Full-screen intro of the top-10 reel: 540x960 CSS px rendered at 2x -> 1080x1920.
   Title + games, a podium for #1-#3, then rows for #4-#10. Every element animates in
   with a CSS animation that is paused and seeked to window.FRAME_T (seconds), so each
   video frame is rendered at an exact time. Each player brings its own team colours
   as --tc (dark) / --ta (accent) / --tt (accent readable on dark). */
:root {
  --bg: #0d1219;
  --ink: #ffffff;
  --muted: rgba(255, 255, 255, .64);
  --faint: rgba(255, 255, 255, .12);
  --gold: #f5c542;
  --font: "Figtree", "Segoe UI", system-ui, sans-serif;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --t: 99;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); width: 540px; height: 960px; overflow: hidden; font-variant-numeric: tabular-nums; }
.page { position: relative; width: 540px; height: 960px; padding: 34px 18px 20px; display: flex; flex-direction: column; gap: 14px;
  background:
    radial-gradient(ellipse 80% 40% at 50% 0%, rgba(245, 197, 66, .18), transparent 70%),
    radial-gradient(ellipse 70% 30% at 50% 100%, rgba(80, 120, 255, .12), transparent 70%),
    var(--bg); }

/* seeked animations: each element sets --d (delay, s) */
.in { animation: rise .55s cubic-bezier(.2, .8, .2, 1) both paused; animation-delay: calc((var(--d, 0) - var(--t)) * 1s); }
.pop { animation: pop .6s cubic-bezier(.2, 1.4, .3, 1) both paused; animation-delay: calc((var(--d, 0) - var(--t)) * 1s); }
.slide { animation: slide .5s cubic-bezier(.2, .8, .2, 1) both paused; animation-delay: calc((var(--d, 0) - var(--t)) * 1s); }
@keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
@keyframes pop { from { opacity: 0; transform: translateY(26px) scale(.86); } to { opacity: 1; transform: none; } }
@keyframes slide { from { opacity: 0; transform: translateX(-40px); } to { opacity: 1; transform: none; } }

/* ---- title ---- */
.head { text-align: center; display: grid; gap: 6px; }
.kicker { font-size: 11px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); }
h1 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 60px; line-height: .88; text-transform: uppercase; letter-spacing: .01em; }
h1 span { color: var(--gold); }
.sub { font-size: 10.5px; font-weight: 600; color: var(--muted); }
.games { display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; margin-top: 4px; }
.games span { font-size: 9px; font-weight: 700; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--faint); background: rgba(255, 255, 255, .04); }
.games b { font-weight: 800; }

/* ---- podium ---- */
.podium { display: grid; grid-template-columns: 1fr 1.12fr 1fr; gap: 8px; align-items: end; }
.pod { position: relative; border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 0 6px 9px;
  background: linear-gradient(180deg, color-mix(in srgb, var(--ta) 55%, var(--tc)) 0%, var(--tc) 58%); box-shadow: 0 10px 26px rgba(0, 0, 0, .45), inset 0 0 0 1px rgba(255, 255, 255, .12); }
.pod.p1 { box-shadow: 0 12px 30px rgba(0, 0, 0, .5), 0 0 0 2px var(--gold), 0 0 26px rgba(245, 197, 66, .35); }
.pod .rk { position: absolute; left: 8px; top: 6px; font-family: var(--display); font-weight: 800; font-size: 30px; line-height: 1; color: #fff; text-shadow: 0 2px 6px rgba(0, 0, 0, .4); z-index: 2; }
.pod.p1 .rk { color: var(--gold); font-size: 36px; }
.pod .logo { position: absolute; right: 7px; top: 8px; width: 26px; height: 26px; object-fit: contain; z-index: 2; filter: drop-shadow(0 2px 4px rgba(0, 0, 0, .4)); }
.pod .shot { height: 118px; width: 100%; position: relative; }
.pod.p1 .shot { height: 142px; }
.pod .shot img { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); height: 112%; }
.pod .shot .ini { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 54px; color: rgba(255, 255, 255, .5); }
.pod .nm { width: 100%; margin-top: 6px; display: grid; }
.pod .nm small { font-size: 9px; font-weight: 700; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pod .nm b { font-family: var(--display); font-weight: 800; font-size: 19px; line-height: 1; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pod.p1 .nm b { font-size: 22px; }
.pod .fp { margin-top: 5px; font-family: var(--display); font-weight: 800; font-size: 32px; line-height: .9; color: var(--tt); }
.pod.p1 .fp { font-size: 40px; color: var(--gold); }
.pod .fp small { display: block; font-family: var(--font); font-size: 7px; letter-spacing: .14em; color: var(--muted); margin-top: 2px; }
.pod .line { margin-top: 6px; display: flex; flex-wrap: wrap; justify-content: center; gap: 3px; }
.chip { font-size: 8px; font-weight: 800; padding: 2px 5px; border-radius: 4px; background: rgba(255, 255, 255, .1); white-space: nowrap; }
.chip b { font-family: var(--display); font-size: 11px; margin-right: 2px; }
.chip.hi { background: var(--ta); color: var(--on); }
.pod .game { margin-top: 5px; font-size: 7.5px; font-weight: 700; color: var(--muted); letter-spacing: .04em; }

/* ---- rows #4-#10 ---- */
.rows { display: grid; gap: 6px; }
.row { position: relative; height: 50px; display: grid; grid-template-columns: 30px 40px 1fr auto 58px; gap: 8px; align-items: center; padding: 0 8px 0 10px; border-radius: 10px; overflow: hidden;
  background: linear-gradient(90deg, color-mix(in srgb, var(--tc) 85%, transparent), rgba(255, 255, 255, .04) 70%); box-shadow: inset 0 0 0 1px var(--faint); }
.row::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--ta); }
.row .rk { font-family: var(--display); font-weight: 800; font-size: 26px; text-align: center; color: var(--tt); }
.row .face { width: 40px; height: 40px; border-radius: 50%; overflow: hidden; position: relative; background: rgba(255, 255, 255, .14); box-shadow: 0 0 0 2px var(--ta); }
.row .face img { position: absolute; left: 50%; top: 3px; height: 48px; transform: translateX(-50%); }
.row .face .ini { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 16px; }
.row .who { min-width: 0; display: grid; gap: 2px; }
.row .who b { font-family: var(--display); font-weight: 800; font-size: 18px; line-height: 1; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .who small { font-size: 8px; font-weight: 700; color: var(--muted); white-space: nowrap; display: flex; align-items: center; gap: 4px; }
.row .who small img { width: 13px; height: 13px; object-fit: contain; }
.row .line { display: flex; gap: 3px; }
.row .fp { justify-self: end; text-align: center; padding: 4px 0 3px; width: 54px; border-radius: 8px; background: rgba(0, 0, 0, .35); box-shadow: inset 0 0 0 1px var(--faint); }
.row .fp b { display: block; font-family: var(--display); font-weight: 800; font-size: 21px; line-height: 1; }
.row .fp small { font-size: 6.5px; font-weight: 800; letter-spacing: .14em; color: var(--muted); }
.foot { margin-top: auto; text-align: center; font-size: 9px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.foot b { color: var(--gold); }
</style>

<div class="page">
  {{BODY}}
</div>
<script>
const m = location.hash.match(/t=([\d.]+)/);
document.documentElement.style.setProperty("--t", window.FRAME_T ?? (m ? parseFloat(m[1]) : 99));
</script>
